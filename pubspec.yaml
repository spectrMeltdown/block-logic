name: block_logic
description: "A block-based multiplayer programming game"
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  flame: ^1.17.0
  cloud_firestore: ^4.17.3
  webview_flutter: ^4.8.0
  firebase_storage: ^11.7.7
  firebase_auth: ^4.20.0
  geocoding: ^3.0.0
  geolocator: ^12.0.0
  permission_handler: ^11.3.1
  http: ^1.2.1
  firebase_core: ^2.32.0
  #firebase_analytics: ^10.10.7
  #firebase_crashlytics: ^3.5.7
  toastification: ^2.0.0
  font_awesome_flutter: ^10.7.0
  flutter_native_splash: ^2.4.0
  lottie: ^3.1.2
  flame_audio: ^2.10.2
  flame_forge2d: ^0.18.1
  flame_lottie: ^0.4.1
  flame_splash_screen: ^0.3.0
  animate_do: ^3.3.4
  firebase_messaging: ^14.9.4
  flutter_local_notifications: ^17.1.2
  flutter_riverpod: ^2.5.1
  mime: ^1.0.5
  file_picker: ^8.0.6
  image_cropper: ^7.1.0
  riverpod_annotation: ^2.3.5
  path_provider: ^2.1.3
  path: ^1.9.0
  shared_preferences: ^2.2.3
  page_transition: ^2.1.0
  video_player: ^2.9.1
  internet_connection_checker: ^1.0.0+1
  encrypt: ^5.0.3
  uuid: ^4.4.2
  pinput: ^5.0.0
  widget_and_text_animator: ^1.1.5
  marquee: ^2.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: "^0.13.1"
  custom_lint: any
  riverpod_lint: any
  riverpod_generator: ^2.4.0
  build_runner: ^2.4.11
dependency_overrides:
  fading_edge_scrollview: ^4.1.1
flutter:
  uses-material-design: true
  assets:
    - assets/fonts/
    - assets/images/
    - assets/audio/
    - assets/animations/
    - assets/videos/
    - assets/animations/backgrounds/
  fonts:
    - family: Play
      fonts:
        - asset: assets/fonts/Play-Regular.ttf
        - asset: assets/fonts/Play-Bold.ttf
          weight: 700
    - family: MajorMonoDisplay
      fonts:
        - asset: assets/fonts/MajorMonoDisplay-Regular.ttf

flutter_launcher_icons:
  # dart run flutter_launcher_icons
  android: "launcher_icon"
  image_path: "assets/images/logo.png"
  min_sdk_android: 21 # android min sdk min:16, default 21
  adaptive_icon_background: #0B1B33
  adaptive_icon_foreground: "assets/images/logo.png"
  web:
    generate: true
    image_path: "assets/images/logo.png"
    background_color: #0B1B33
    theme_color: #0B1B33

flutter_native_splash:
  # dart run flutter_native_splash:create
  # dart run flutter_native_splash:remove
  color: "#0B1B33"
  background_image: "assets/images/background_no_grid.png"
  image: "assets/images/logo.png"
  #branding: assets/dart.png
  #branding_mode: bottom
  #color_dark: "#0B1B33"
  #background_image_dark: "assets/dark-background.png"
  #image_dark: assets/splash-invert.png
  #branding_dark: assets/dart_dark.png
  android_12:
    image: "assets/images/logo-splash.png"
    color: "#0B1B33"
    # icon_background_color: "#111111"
    #branding: assets/dart.png
    #image_dark: assets/android12splash-invert.png
    #color_dark: "#042a49"
    #icon_background_color_dark: "#eeeeee"

  #android: false
  ios: false
  web: false

  #color_web: "#042a49"
  #color_dark_web: "#042a49"
  #image_web: assets/splash-web.gif
  #image_dark_web: assets/splash-invert-web.gif
  #background_image_web: "assets/background-web.png"
  #background_image_dark_web: "assets/dark-background-web.png"

  #android_gravity: center
  #ios_content_mode: center
  # web_image_mode: center

  android_screen_orientation: sensorPortrait
  fullscreen: true
