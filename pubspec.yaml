name: block_logic
description: "A block-based multiplayer programming game"
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  cupertino_icons: ^1.0.8
  webview_flutter: ^4.13.0
  firebase_storage: ^12.4.10
  firebase_auth: ^5.7.0
  geocoding: ^3.0.0
  geolocator: ^13.0.4
  permission_handler: ^11.4.0
  firebase_core: ^3.15.2
  #firebase_analytics: ^10.10.7
  #firebase_crashlytics: ^3.5.7
  http: ^1.5.0
  # toastification: ^2.3.0
  page_transition: ^2.2.1
  font_awesome_flutter: ^10.9.1
  animate_do: ^3.3.9
  flutter_native_splash: ^2.4.6
  lottie: ^3.3.1
  flame_audio: ^2.11.10
  # firebase_messaging: ^15.1.3
  flutter_riverpod: ^2.6.1
  mime: ^2.0.0
  file_picker: ^8.3.7
  riverpod_annotation: ^2.6.1
  path_provider: ^2.1.5
  path: ^1.9.1
  shared_preferences: ^2.5.3
  # video_player: ^2.9.2
  encrypt: ^5.0.3
  uuid: ^4.5.1
  widget_and_text_animator: ^1.1.5
  marquee: ^2.3.0
  intl: ^0.19.0
  go_router: ^14.8.1
  fluttertoast: ^8.2.14
  firebase_app_check: ^0.3.2+10
  riverpod: ^2.6.1
  flutter_highlight: ^0.7.0
  highlight: ^0.7.0
  tuple: ^2.0.2
  pdf: ^3.11.3
  printing: ^5.14.2
  html: ^0.15.6
  equatable: ^2.0.7
  rxdart: ^0.28.0
  fl_chart: ^0.69.2
  firebase_database: ^11.3.10
  # flutter_local_notifications: ^17.2.3
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4
  build_runner: ^2.5.4
  riverpod_generator: ^2.6.1
  custom_lint: ^0.6.10
  riverpod_lint: ^2.6.1
dependency_overrides:
  fading_edge_scrollview: ^4.1.1
flutter:
  uses-material-design: true
  assets:
    - assets/fonts/
    - assets/images/
    - assets/audio/
    - assets/animations/
    - assets/animations/backgrounds/
  fonts:
    - family: Play
      fonts:
        - asset: assets/fonts/Play-Regular.ttf
        - asset: assets/fonts/Play-Bold.ttf
          weight: 700
    - family: MajorMonoDisplay
      fonts:
        - asset: assets/fonts/MajorMonoDisplay-Regular.ttf

flutter_launcher_icons:
  # dart run flutter_launcher_icons
  android: "launcher_icon"
  image_path: "assets/images/logo.png"
  min_sdk_android: 21 # android min sdk min:16, default 21
  adaptive_icon_background: #0B1B33
  adaptive_icon_foreground: "assets/images/logo.png"
  web:
    generate: true
    image_path: "assets/images/logo.png"
    background_color: #0B1B33
    theme_color: #0B1B33

flutter_native_splash:
  # dart run flutter_native_splash:create
  # dart run flutter_native_splash:remove
  color: "#0B1B33"
  background_image: "assets/images/background_no_grid.png"
  image: "assets/images/logo.png"
  #branding: assets/dart.png
  #branding_mode: bottom
  #color_dark: "#0B1B33"
  #background_image_dark: "assets/dark-background.png"
  #image_dark: assets/splash-invert.png
  #branding_dark: assets/dart_dark.png
  android_12:
    image: "assets/images/logo-splash.png"
    color: "#0B1B33"
    # icon_background_color: "#111111"
    #branding: assets/dart.png
    #image_dark: assets/android12splash-invert.png
    #color_dark: "#042a49"
    #icon_background_color_dark: "#eeeeee"

  #android: false
  ios: false
  web: false

  #color_web: "#042a49"
  #color_dark_web: "#042a49"
  #image_web: assets/splash-web.gif
  #image_dark_web: assets/splash-invert-web.gif
  #background_image_web: "assets/background-web.png"
  #background_image_dark_web: "assets/dark-background-web.png"

  #android_gravity: center
  #ios_content_mode: center
  # web_image_mode: center

  android_screen_orientation: sensorPortrait
  fullscreen: true
