plugins {
    id "com.android.application"
    // START: FlutterFire Configuration
    id 'com.google.gms.google-services'
    id 'com.google.firebase.crashlytics'
    // END: FlutterFire Configuration
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file("local.properties")
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader("UTF-8") { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty("flutter.versionCode")
if (flutterVersionCode == null) {
    flutterVersionCode = "1"
}

def flutterVersionName = localProperties.getProperty("flutter.versionName")
if (flutterVersionName == null) {
    flutterVersionName = "1.0"
}

android {
    namespace = "com.uncaughtexception.blocklogic"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = flutter.ndkVersion
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    defaultConfig {
        applicationId = "com.uncaughtexception.blocklogic"
        minSdk = flutter.minSdkVersion
        targetSdk = flutter.targetSdkVersion
        minSdkVersion = 30
        versionCode = flutterVersionCode.toInteger()
        versionName = flutterVersionName
    }

    signingConfigs {     
        release {
            keyAlias = 'my-key-alias'
            keyPassword = 'willow123'
            storeFile = file('release-key.jks')
            storePassword = 'willow123'
        }
        debug {
            keyAlias = 'my-key-alias'
            keyPassword = 'willow123'
            storeFile = file('release-key.jks')
            storePassword = 'willow123'
        }
    }

    buildTypes {
        debug {
            signingConfig = signingConfigs.debug
        }
        release {
            // signingConfig = signingConfigs.debug
            signingConfig = signingConfigs.release
            // minifyEnabled true
            // shrinkResources true
            // debuggable false
            // proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro' 
        } 
    }
}

flutter {
    source = "../.."
}

dependencies {
    // Import the BoM for the Firebase platform
    implementation platform("com.google.firebase:firebase-bom:33.3.0")
    implementation 'com.google.android.gms:play-services-basement:latest_version'
    // Add the dependencies for the App Check libraries
    implementation("com.google.firebase:firebase-appcheck-playintegrity")
    implementation("com.google.firebase:firebase-auth")
    // Other dependencies...
}
apply plugin: 'com.google.gms.google-services'