targets:
  $default:
    sources:
      include:
        - lib/logic/**.dart
        - $package$
        - lib/$lib$
    builders:
      # copy_with_extension_gen:
      #   enabled: true
      #   options:
      #     copy_with_null: true # default is false
      #     skip_fields: true # default is false
      source_gen|combining_builder:
        generate_for:
          - lib/logic/firebase_providers/*.dart
          - lib/logic/services/*.dart
          - lib/logic/game/*.dart
        options:
          build_extensions:
            "lib/{{path}}/{{file}}.dart": "lib/{{path}}/generated/{{file}}.g.dart"
