targets:
  $default:
    sources:
      include:
      - lib/logic/**.dart
      - $package$
      - lib/$lib$
    builders:
      source_gen|combining_builder:
        generate_for:
          - lib/logic/firebase_providers/*.dart
          - lib/logic/services/*.dart
        options:
          build_extensions: 
            #{'.service.dart': ['.gr.dart']}
            'lib/{{path}}/{{file}}.dart': 'lib/{{path}}/generated/{{file}}.g.dart'
            #'^lib/logic/firebase_providers/{{}}.provider.dart': 'lib/logic/firebase_providers/generated/{{}}.g.dart'
